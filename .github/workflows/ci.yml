name: CI - Unit and System Tests

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Gradle wrapper permissions
        working-directory: Eclipse
        run: chmod +x gradlew

      - name: Run unit tests
        working-directory: Eclipse
        run: ./gradlew unitTest

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: Eclipse/build/reports/tests/unitTest/

  system-tests:
    name: System Tests
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant Gradle wrapper permissions
        working-directory: Eclipse
        run: chmod +x gradlew

      - name: Run system tests
        working-directory: Eclipse
        run: ./gradlew systemTest

      - name: Upload system test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-test-results
          path: Eclipse/build/reports/tests/systemTest/
