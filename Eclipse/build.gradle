plugins {
    id 'java'
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    // Testing dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    testImplementation 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
    testImplementation 'org.mockito:mockito-core:5.1.1'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.1.1'
    
    // Additional testing for astronomical calculations
    testImplementation 'org.junit.jupiter:junit-jupiter-params:5.9.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'EclipseSlider'
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
            exclude 'test/**'
        }
    }
    test {
        java {
            srcDirs = ['src/test/java']
        }
    }
}

// Task to run the application
task runEclipse(type: JavaExec) {
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'EclipseSlider'
}

// Configure test task (runs all tests)
test {
    useJUnitPlatform()
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
}

// Task to run only unit tests (tagged with @Tag("unit"))
task unitTest(type: Test) {
    useJUnitPlatform {
        includeTags 'unit'
    }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    description = 'Runs unit tests tagged with @Tag("unit")'
    group = 'verification'
}

// Task to run only system tests (tagged with @Tag("system"))
task systemTest(type: Test) {
    useJUnitPlatform {
        includeTags 'system'
    }
    testLogging {
        events "passed", "skipped", "failed"
        exceptionFormat "full"
    }
    description = 'Runs system tests tagged with @Tag("system")'
    group = 'verification'
}