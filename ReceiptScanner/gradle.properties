# Corporate Network Configuration for Gradle
# Based on emgeiger/Gradle template

# Android SDK and build tools
android.useAndroidX=true
android.enableJetifier=true

# Gradle Configuration
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.parallel=true

# Build directory outside OneDrive to avoid file lock issues
buildDir=C:/temp/gradle-builds/ReceiptScanner

# Corporate Network SSL Settings (for development environments)
# WARNING: These are for development only, not production
systemProp.javax.net.ssl.trustStore=NONE
systemProp.javax.net.ssl.trustStoreType=Windows-ROOT
systemProp.com.sun.net.ssl.checkRevocation=false
systemProp.trust_all_cert=true
systemProp.javax.net.ssl.trustStorePassword=
systemProp.java.net.useSystemProxies=true
systemProp.com.sun.net.ssl.enableECC=false
systemProp.sun.security.ssl.allowUnsafeRenegotiation=true
systemProp.sun.security.ssl.allowLegacyHelloMessages=true

# Network timeouts
systemProp.sun.net.client.defaultConnectTimeout=60000
systemProp.sun.net.client.defaultReadTimeout=60000

# Proxy Configuration (uncomment and configure if needed)
# systemProp.http.proxyHost=proxy.yourcompany.com
# systemProp.http.proxyPort=8080
# systemProp.https.proxyHost=proxy.yourcompany.com
# systemProp.https.proxyPort=8080
# systemProp.http.proxyUser=DOMAIN\\username
# systemProp.http.proxyPassword=your-password
# systemProp.https.proxyUser=DOMAIN\\username
# systemProp.https.proxyPassword=your-password

# Non-proxy hosts (localhost and internal addresses)
systemProp.http.nonProxyHosts=localhost|127.*|[::1]|*.local|*.ovintiv.com
